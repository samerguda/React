    :root {
      --primary: #1e88e5;
      --primary-dark: #0d47a1;
      --accent: #d81b60;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 24px 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    .search-box {
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #fff;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .spanish-verb {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--primary-dark);
      direction: ltr;
    }

    .number {
      font-size: 0.8rem;
      background: var(--border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .arabic-meaning {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .pronunciation {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 500;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      
      header h1 {
        font-size: 1.6rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    function renderVerbs(verbs) {
      const grid = document.getElementById('verbsGrid');
      grid.innerHTML = '';
      
      verbs.forEach((verb, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="spanish-verb">${verb.spanish}</span>
            <span class="number">#${index + 1}</span>
          </div>
          <div class="card-body">
            <div class="arabic-meaning">${verb.arabic}</div>
            ${verb.pronunciation ? `<div class="pronunciation">النطق: ${verb.pronunciation}</div>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterVerbs() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = verbsData.filter(item => 
        item.spanish.toLowerCase().includes(query) ||
        item.arabic.includes(query) ||
        (item.pronunciation && item.pronunciation.includes(query))
      );
      renderVerbs(filtered);
    }

    // Initial render
    renderVerbs(verbsData);
